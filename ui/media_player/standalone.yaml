---
# Standalone media player page — full-screen playback UI as its OWN top-level
# swipeable page, with no small tile / long-press step.
#
# Include this directly from your device YAML (do NOT also include remote.yaml
# for the same uid — this file is self-sufficient).
#
# vars:
#   uid:          unique identifier
#   entity_id:    HA media_player entity, e.g. "media_player.spotify"
#   text:         header label text
#   page_id:      page the back button returns to (default: main_page)
#
# Abstract script contract (implemented below, REMOTE only — same as remote.yaml):
#   ${uid}_media_play_pause / _next / _previous / _set_volume / _shuffle_set / _repeat_set

globals:
- id: ${uid}_is_playing
  type: bool
  initial_value: 'false'
- id: ${uid}_current_volume
  type: float
  initial_value: '0.5'
- id: ${uid}_is_shuffle
  type: bool
  initial_value: 'false'
- id: ${uid}_repeat_mode
  type: int
  initial_value: '0'
- id: ${uid}_progress_percent
  type: int
  initial_value: '0'
- id: ${uid}_media_position
  type: float
  initial_value: '0.0'
- id: ${uid}_media_duration
  type: float
  initial_value: '0.0'
- id: ${uid}_media_title
  type: std::string
  initial_value: '""'
- id: ${uid}_media_artist
  type: std::string
  initial_value: '""'

# ── HA SENSORS ──────────────────────────────────────────────────────────────
# (same bindings as remote.yaml, just calling sync_state directly — no tile to update)

text_sensor:
- platform: homeassistant
  id: ${uid}_ha_state
  entity_id: ${entity_id}
  internal: true
  on_value:
  - lambda: id(${uid}_is_playing) = (x == "playing");
  - script.execute: ${uid}_sync_state

- platform: homeassistant
  id: ${uid}_ha_title
  entity_id: ${entity_id}
  attribute: media_title
  internal: true
  on_value:
  - if:
      condition:
        lambda: return !x.empty() && x != "None";
      then:
      - lambda: id(${uid}_media_title) = x;
      - script.execute: ${uid}_sync_state

- platform: homeassistant
  id: ${uid}_ha_artist
  entity_id: ${entity_id}
  attribute: media_artist
  internal: true
  on_value:
  - if:
      condition:
        lambda: return !x.empty() && x != "None";
      then:
      - lambda: id(${uid}_media_artist) = x;
      - script.execute: ${uid}_sync_state

- platform: homeassistant
  id: ${uid}_ha_volume
  entity_id: ${entity_id}
  attribute: volume_level
  internal: true
  on_value:
  - if:
      condition:
        lambda: return !x.empty() && x != "None" && !id(${uid}_volume_send)->is_running();
      then:
      - lambda: id(${uid}_current_volume) = atof(x.c_str());
      - script.execute: ${uid}_sync_state

- platform: homeassistant
  id: ${uid}_ha_position
  entity_id: ${entity_id}
  attribute: media_position
  internal: true
  on_value:
  - if:
      condition:
        lambda: return !x.empty() && x != "None";
      then:
      - lambda: id(${uid}_media_position) = atof(x.c_str());

- platform: homeassistant
  id: ${uid}_ha_duration
  entity_id: ${entity_id}
  attribute: media_duration
  internal: true
  on_value:
  - if:
      condition:
        lambda: return !x.empty() && x != "None";
      then:
      - lambda: id(${uid}_media_duration) = atof(x.c_str());

- platform: homeassistant
  id: ${uid}_ha_shuffle
  entity_id: ${entity_id}
  attribute: shuffle
  internal: true
  on_value:
  - if:
      condition:
        lambda: return !x.empty() && x != "None";
      then:
      - lambda: id(${uid}_is_shuffle) = (x == "True" || x == "true");
      - script.execute: ${uid}_sync_state

- platform: homeassistant
  id: ${uid}_ha_repeat
  entity_id: ${entity_id}
  attribute: repeat
  internal: true
  on_value:
  - if:
      condition:
        lambda: return !x.empty() && x != "None";
      then:
      - lambda: |-
          if (x == "one") id(${uid}_repeat_mode) = 1;
          else if (x == "all") id(${uid}_repeat_mode) = 2;
          else id(${uid}_repeat_mode) = 0;
      - script.execute: ${uid}_sync_state

# ── ABSTRACT ACTION SCRIPTS — REMOTE IMPLEMENTATION (same as remote.yaml) ────

script:
- id: ${uid}_media_play_pause
  then:
  - homeassistant.action:
      action: media_player.media_play_pause
      data:
        entity_id: ${entity_id}

- id: ${uid}_media_next
  then:
  - homeassistant.action:
      action: media_player.media_next_track
      data:
        entity_id: ${entity_id}

- id: ${uid}_media_previous
  then:
  - homeassistant.action:
      action: media_player.media_previous_track
      data:
        entity_id: ${entity_id}

- id: ${uid}_media_set_volume
  then:
  - homeassistant.action:
      action: media_player.volume_set
      data:
        entity_id: ${entity_id}
      data_template:
        volume_level: "{{ vol|float }}"
      variables:
        vol: !lambda return id(${uid}_current_volume);

- id: ${uid}_media_shuffle_set
  then:
  - homeassistant.action:
      action: media_player.shuffle_set
      data:
        entity_id: ${entity_id}
      data_template:
        shuffle: "{{ shuf }}"
      variables:
        shuf: !lambda return id(${uid}_is_shuffle);

- id: ${uid}_media_repeat_set
  then:
  - homeassistant.action:
      action: media_player.repeat_set
      data:
        entity_id: ${entity_id}
      data_template:
        repeat: "{{ rpt }}"
      variables:
        rpt: !lambda |-
          int mode = id(${uid}_repeat_mode);
          if (mode == 1) return std::string("one");
          if (mode == 2) return std::string("all");
          return std::string("off");

# Volume debounce — restart mode cancels previous, waits 500ms, then sends
- id: ${uid}_volume_send
  mode: restart
  then:
  - delay: 500ms
  - script.execute: ${uid}_media_set_volume

# Sync all globals → LVGL widgets (page only — no tile exists in standalone mode)
- id: ${uid}_sync_state
  then:
  - lvgl.label.update:
      id: ${uid}_track_label
      text: !lambda |-
        std::string title = id(${uid}_media_title);
        if (title.empty()) return std::string("Not Playing");
        return title;
  - lvgl.label.update:
      id: ${uid}_artist_label
      text: !lambda return id(${uid}_media_artist);

  - if:
      condition:
        lambda: return id(${uid}_is_playing);
      then:
      - lvgl.label.update:
          id: ${uid}_play_pause_icon
          text: $mdi_pause
      else:
      - lvgl.label.update:
          id: ${uid}_play_pause_icon
          text: $mdi_play

  - if:
      condition:
        lambda: return id(${uid}_is_shuffle);
      then:
      - lvgl.widget.update:
          id: ${uid}_shuffle_icon
          text_color: $icon_on_color
      else:
      - lvgl.widget.update:
          id: ${uid}_shuffle_icon
          text_color: $icon_off_color

  - if:
      condition:
        lambda: return id(${uid}_repeat_mode) == 0;
      then:
      - lvgl.label.update:
          id: ${uid}_repeat_icon
          text: $mdi_repeat
      - lvgl.widget.update:
          id: ${uid}_repeat_icon
          text_color: $icon_off_color
  - if:
      condition:
        lambda: return id(${uid}_repeat_mode) == 1;
      then:
      - lvgl.label.update:
          id: ${uid}_repeat_icon
          text: $mdi_repeat_once
      - lvgl.widget.update:
          id: ${uid}_repeat_icon
          text_color: $icon_on_color
  - if:
      condition:
        lambda: return id(${uid}_repeat_mode) == 2;
      then:
      - lvgl.label.update:
          id: ${uid}_repeat_icon
          text: $mdi_repeat
      - lvgl.widget.update:
          id: ${uid}_repeat_icon
          text_color: $icon_on_color

  - if:
      condition:
        lambda: return !id(${uid}_volume_send)->is_running();
      then:
      - lvgl.slider.update:
          id: ${uid}_volume_slider
          value: !lambda return (int)(id(${uid}_current_volume) * 100);

  - script.execute: ${uid}_update_play_indicator

# Update the now-playing icon glow based on play state
- id: ${uid}_update_play_indicator
  then:
  - if:
      condition:
        lambda: return id(${uid}_is_playing);
      then:
      - lvgl.widget.update:
          id: ${uid}_now_playing_icon
          text_color: $icon_on_color
      - lvgl.widget.update:
          id: ${uid}_now_playing_btn
          shadow_color: $button_on_color
          shadow_spread: 8
          shadow_width: 30
      else:
      - lvgl.widget.update:
          id: ${uid}_now_playing_icon
          text_color: $icon_off_color
      - lvgl.widget.update:
          id: ${uid}_now_playing_btn
          shadow_color: 0x888888
          shadow_spread: 2
          shadow_width: 20

# ── PROGRESS INTERVAL ─────────────────────────────────────────────────────────
interval:
- interval: 1s
  then:
  - if:
      condition:
        lambda: return id(${uid}_is_playing);
      then:
      - lambda: |-
          float pos = id(${uid}_media_position);
          float dur = id(${uid}_media_duration);
          if (dur > 0) {
            pos += 1.0f;
            if (pos > dur) pos = dur;
            id(${uid}_media_position) = pos;
            id(${uid}_progress_percent) = (int)((pos / dur) * 100.0f);
          }
      - lvgl.bar.update:
          id: ${uid}_progress_bar
          value: !lambda return id(${uid}_progress_percent);

# ── THE PAGE ITSELF — a peer of main_page, swipeable, no tile involved ──────

lvgl:
  pages:
  - id: ${uid}_standalone_page
    styles: page_style
    scrollable: false
    scrollbar_mode: "OFF"
    <<: !include ../../common/swipe_navigation.yaml
    widgets:

    - button:
        id: ${uid}_back_btn
        align: TOP_LEFT
        x: 10
        y: 10
        width: 60
        height: 60
        bg_opa: transp
        border_width: 0
        shadow_width: 0
        radius: 30
        widgets:
        - label:
            align: CENTER
            text_font: $icon_font
            text_color: $label_on_color
            text: $mdi_chevron_left
        on_click:
        - lvgl.page.show:
            id: ${page_id | default("main_page")}
            animation: MOVE_RIGHT
            time: 300ms

    - label:
        id: ${uid}_header_label
        align: TOP_MID
        y: 22
        text_font: nunito_24
        text_color: $label_on_color
        text: ${text}

    - button:
        id: ${uid}_now_playing_btn
        align: CENTER
        y: -25%
        width: 120
        height: 120
        radius: 60
        bg_color: $button_off_color
        border_width: 0
        shadow_opa: cover
        shadow_spread: 2
        shadow_width: 20
        shadow_color: 0x888888
        clickable: false
        widgets:
        - label:
            id: ${uid}_now_playing_icon
            align: CENTER
            text_font: $icon_font
            text_color: $icon_off_color
            text: $mdi_music_note

    - label:
        id: ${uid}_track_label
        align: CENTER
        y: -8%
        width: 80%
        text_font: nunito_24
        text_color: $label_on_color
        text_align: CENTER
        long_mode: DOT
        text: "Not Playing"

    - label:
        id: ${uid}_artist_label
        align: CENTER
        y: -1%
        width: 80%
        text_font: nunito_18
        text_color: $label_off_color
        text_align: CENTER
        long_mode: DOT
        text: ""

    - bar:
        id: ${uid}_progress_bar
        align: CENTER
        y: 8%
        width: 80%
        height: 6
        min_value: 0
        max_value: 100
        value: 0
        bg_color: very_dark_gray
        indicator:
          bg_color: $button_on_color

    - button:
        id: ${uid}_shuffle_btn
        align: CENTER
        x: -40%
        y: 20%
        width: 50
        height: 50
        bg_opa: transp
        border_width: 0
        shadow_width: 0
        on_click:
        - lambda: id(${uid}_is_shuffle) = !id(${uid}_is_shuffle);
        - script.execute: ${uid}_media_shuffle_set
        - script.execute: ${uid}_sync_state
        widgets:
        - label:
            id: ${uid}_shuffle_icon
            align: CENTER
            text_font: $icon_font
            text_color: $icon_off_color
            text: $mdi_shuffle

    - button:
        id: ${uid}_prev_btn
        align: CENTER
        x: -20%
        y: 20%
        width: 50
        height: 50
        bg_opa: transp
        border_width: 0
        shadow_width: 0
        on_click:
        - script.execute: ${uid}_media_previous
        widgets:
        - label:
            align: CENTER
            text_font: $icon_font
            text_color: $label_on_color
            text: $mdi_skip_previous

    - button:
        id: ${uid}_play_pause_btn
        align: CENTER
        y: 20%
        width: 70
        height: 70
        radius: 35
        bg_color: $button_on_color
        border_width: 0
        shadow_width: 0
        on_click:
        - script.execute: ${uid}_media_play_pause
        widgets:
        - label:
            id: ${uid}_play_pause_icon
            align: CENTER
            text_font: $icon_font
            text_color: $label_on_color
            text: $mdi_play

    - button:
        id: ${uid}_next_btn
        align: CENTER
        x: 20%
        y: 20%
        width: 50
        height: 50
        bg_opa: transp
        border_width: 0
        shadow_width: 0
        on_click:
        - script.execute: ${uid}_media_next
        widgets:
        - label:
            align: CENTER
            text_font: $icon_font
            text_color: $label_on_color
            text: $mdi_skip_next

    - button:
        id: ${uid}_repeat_btn
        align: CENTER
        x: 40%
        y: 20%
        width: 50
        height: 50
        bg_opa: transp
        border_width: 0
        shadow_width: 0
        on_click:
        - lambda: |-
            int mode = id(${uid}_repeat_mode);
            if (mode == 0) mode = 2;
            else if (mode == 2) mode = 1;
            else mode = 0;
            id(${uid}_repeat_mode) = mode;
        - script.execute: ${uid}_media_repeat_set
        - script.execute: ${uid}_sync_state
        widgets:
        - label:
            id: ${uid}_repeat_icon
            align: CENTER
            text_font: $icon_font
            text_color: $icon_off_color
            text: $mdi_repeat

    - label:
        id: ${uid}_volume_icon
        align: BOTTOM_LEFT
        x: 8%
        y: -10%
        text_font: $icon_font
        text_color: $label_off_color
        text: $mdi_volume_high

    - slider:
        id: ${uid}_volume_slider
        align: BOTTOM_MID
        x: 5%
        y: -10%
        width: 65%
        height: 8
        min_value: 0
        max_value: 100
        value: 50
        on_value:
        - globals.set:
            id: ${uid}_current_volume
            value: !lambda return x / 100.0f;
        on_release:
        - script.execute: ${uid}_volume_send
